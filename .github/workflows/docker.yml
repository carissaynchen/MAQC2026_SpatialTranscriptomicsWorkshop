name: Build and Push Docker image

on:
  workflow_dispatch:

  push:
    paths:
      - "tutorial/*.qmd"
      - "install_packages.R"
      - "tutorial/scripts/cache-data.R"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/st-workshop

jobs:
  build-amd64:
    name: Build amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64


  build-arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  full-render:
    name: Test Quarto render (${{ matrix.arch }})
    needs:
      - build-amd64
      - build-arm64

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull architecture image
        run: |
          docker pull \
            "${{ env.IMAGE_NAME }}:${{ matrix.arch }}"

      - name: Prepare render output directory
        run: |
          mkdir -p "${{ github.workspace }}/rendered"

      - name: Render complete tutorial
        run: |
          docker run --rm \
            --user root \
            --entrypoint /bin/bash \
            --volume "${{ github.workspace }}/rendered:/tutorial/_ci-render" \
            "${{ env.IMAGE_NAME }}:${{ matrix.arch }}" \
            -lc '
              cd /tutorial
              quarto render extended-workflow-cosmx.qmd \
                --to html \
                --output-dir _ci-render \
                -M embed-resources:true
            '

      - name: Verify rendered HTML
        run: |
          test -s \
            rendered/extended-workflow-cosmx.html

      - name: Upload rendered tutorial
        uses: actions/upload-artifact@v4
        with:
          name: extended-workflow-cosmx-${{ matrix.arch }}
          path: rendered/extended-workflow-cosmx.html
          if-no-files-found: error
          retention-days: 1

  create-manifest:
    name: Create multi-architecture image
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-architecture image
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            "${{ env.IMAGE_NAME }}:amd64" \
            "${{ env.IMAGE_NAME }}:arm64"

      - name: Inspect multi-architecture image
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE_NAME }}:latest"
